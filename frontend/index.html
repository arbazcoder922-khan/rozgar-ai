<!-- Login Button -->
  <a href="#" class="login-btn" onclick="openModal()" data-i18n="nav_login">Login / Sign Up</a>

  <!-- Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modal-title">Login</h2>

      <form id="auth-form">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="auth-password" placeholder="Enter your password" required>
        
        <!-- Message dikhane ke liye -->
        <div id="auth-message" style="margin-top:10px; font-size:14px; text-align:center;"></div>

        <button type="submit" class="primary-btn" id="auth-submit-btn" style="margin-top:15px;">Login</button>
        
        <div style="margin-top:15px; text-align:center; font-size:14px;">
          <a href="#" id="toggle-auth-mode" style="color: #2563eb; text-decoration: none;">Don't have an account? Sign up</a>
        </div>
      </form>

      <div class="divider">OR</div>

      <!-- Google Sign In -->
      <button class="google-btn">Sign in with Google</button>
    </div>
  </div>
</div>
